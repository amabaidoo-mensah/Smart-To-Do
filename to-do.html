<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="to-do.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>Smart To-Do</title>
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <aside>

            <h4>Smart To-Do</h4>

            <ul>

                <li class="active">

                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </li>

                <li>
                    <i class="fa-solid fa-list-check"></i>
                    My Tasks
                </li>

                <li>
                    <i class="fa-solid fa-calendar-days"></i>
                    Calendar
                </li>

                <li>
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </li>

            </ul>

        </aside>


        <!-- Main Content -->
        <main>

            <header>

                <p>Welcome back, (name)</p>

                <div class="headerActions">

                    <div class="searchBox">
                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input type="text" placeholder="Search tasks...">
                    </div>

                    <i class="fa-solid fa-moon"></i>

                    <i class="fa-solid fa-user"></i>

                </div>

            </header>

            <section class="dashboard">

                <div class="cardContainer">
                    <div class="statCard">
                        <h3>Total Tasks</h3>
                        <p>12</p>
                    </div>

                    <div class="statCard">
                        <h3>Pending</h3>
                        <p>7</p>
                    </div>

                    <div class="statCard">
                        <h3>Completed</h3>
                        <p>5</p>
                    </div>

                </div>

                <div class="dashboardContent">

                    <div class="tasks">
                        <div class="taskHeader">
                            <h3>Today's Tasks</h3>
                            <button id="addTaskBtn"> + Add Task</button>
                        </div>
                        <div class="list"></div>
                    </div>
                    <div class="calendar">

                        <div class="calendarHeader">
                            <button id="prevMonth">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>

                            <h3 id="monthYear"></h3>

                            <button id="nextMonth">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>

                        <div class="calendarDays">
                            <span>Sun</span>
                            <span>Mon</span>
                            <span>Tue</span>
                            <span>Wed</span>
                            <span>Thu</span>
                            <span>Fri</span>
                            <span>Sat</span>
                        </div>

                        <div class="calendarDates" id="calendarDates"></div>

                    </div>

                </div>
            </section>

        </main>

    </div>

    <!-- Add task form -->
    <div class="modal" id="taskModal">

        <div class="modalContent">

            <div class="modalHeader">
                <h3>Add New Task</h3>
                <button type="button" class="closeModal">&times;</button>
            </div>

            <form id="taskForm">

                <p>
                    <label for="tTitle">Task Title</label>
                    <input type="text" id="tTitle" name="title">
                </p>

                <p>
                    <label for="describe">Description</label>
                    <textarea name="describe" id="describe" cols="30" rows="5"></textarea>
                </p>

                <p>
                    <label for="date">Due Date</label>
                    <input type="date" id="date" name="date">
                </p>

                <p>
                    <label for="priority">Priority</label>
                    <select name="priority" id="priority">
                        <option value="">Select Priority</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </p>

                <div class="formActions">
                    <button type="button" class="cancelBtn">Cancel</button>
                    <button type="submit" class="saveBtn">Save Task</button>
                </div>

            </form>

        </div>

    </div>
    <script src="functionality.js"></script>
</body>

</html>
